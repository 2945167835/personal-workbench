<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#4A90D9">
<link rel="manifest" href="manifest.json">
<title>个人工作台</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #4A90D9; --primary-dark: #357ABD; --danger: #E74C3C;
  --success: #27AE60; --warning: #F39C12; --bg: #f0f2f5;
  --card: #fff; --text: #333; --text-light: #888; --border: #e8e8e8;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px; --radius-sm: 8px;
  --nav-h: 60px; --header-h: 50px; --fab-size: 52px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
  overflow: hidden; height: 100dvh; display: flex; justify-content: center;
}
.app { width: 100%; max-width: 480px; height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; }

/* Header */
.header {
  height: var(--header-h); background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 600; flex-shrink: 0;
  padding-top: env(safe-area-inset-top, 0px);
}

/* Main Content */
.main { flex: 1; overflow-y: auto; padding: 12px 16px; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 80px); -webkit-overflow-scrolling: touch; }

/* Bottom Nav */
.nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--card); display: flex;
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
  z-index: 10;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-light); font-size: 11px; cursor: pointer; transition: color .2s;
  -webkit-tap-highlight-color: transparent;
}
.nav-item.active { color: var(--primary); font-weight: 600; }
.nav-item .icon { font-size: 22px; margin-bottom: 2px; }

/* FAB */
.fab {
  position: absolute; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); right: 16px;
  width: var(--fab-size); height: var(--fab-size); border-radius: 50%;
  background: var(--primary); color: #fff; border: none; font-size: 28px;
  box-shadow: 0 4px 16px rgba(74,144,217,0.4);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 20; transition: transform .2s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
}
.fab:active { transform: scale(0.92); }

/* Summary Cards */
.summary-row { display: flex; gap: 10px; margin-bottom: 16px; }
.summary-card {
  flex: 1; background: var(--card); border-radius: var(--radius);
  padding: 14px; text-align: center; box-shadow: var(--shadow);
}
.summary-card .label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.summary-card .value { font-size: 22px; font-weight: 700; }
.summary-card .value.income { color: var(--success); }
.summary-card .value.expense { color: var(--danger); }
.summary-card .value.balance { color: var(--primary); }

/* List */
.list-item {
  background: var(--card); border-radius: var(--radius-sm); padding: 14px;
  margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  display: flex; align-items: center; gap: 12px; position: relative;
}
.list-item .cat-icon {
  width: 40px; height: 40px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.list-item .info { flex: 1; min-width: 0; }
.list-item .info .title { font-size: 14px; font-weight: 500; }
.list-item .info .sub { font-size: 12px; color: var(--text-light); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .amount { font-size: 16px; font-weight: 600; white-space: nowrap; }
.list-item .amount.income { color: var(--success); }
.list-item .amount.expense { color: var(--danger); }
.list-item .del-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: rgba(231,76,60,0.1); color: var(--danger); font-size: 14px;
  cursor: pointer; display: none; align-items: center; justify-content: center;
}
.list-item:active .del-btn, .list-item:hover .del-btn { display: flex; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn .2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  animation: slideUp .25s;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h3 { font-size: 18px; margin-bottom: 16px; text-align: center; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 15px; outline: none;
  background: var(--bg); font-family: inherit; transition: border-color .2s;
  -webkit-appearance: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-group textarea { resize: vertical; min-height: 60px; }
.type-toggle { display: flex; gap: 0; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
.type-toggle button {
  flex: 1; padding: 10px; border: none; background: var(--bg); font-size: 14px;
  cursor: pointer; transition: .2s; font-family: inherit;
}
.type-toggle button.active.income-btn { background: var(--success); color: #fff; }
.type-toggle button.active.expense-btn { background: var(--danger); color: #fff; }

/* Category Chips */
.cat-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-chip {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  font-size: 13px; cursor: pointer; background: var(--bg); transition: .2s;
}
.cat-chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Sub-tabs for car module */
.sub-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.sub-tab {
  flex: 1; padding: 8px; text-align: center; border-radius: 20px;
  font-size: 13px; cursor: pointer; background: var(--card); border: 1px solid var(--border);
  transition: .2s;
}
.sub-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* BMI */
.bmi-display {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  text-align: center; margin-bottom: 16px; box-shadow: var(--shadow);
}
.bmi-value { font-size: 36px; font-weight: 700; color: var(--primary); }
.bmi-label { font-size: 13px; color: var(--text-light); margin-top: 4px; }

/* Chart Container */
.chart-container {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  margin-bottom: 16px; box-shadow: var(--shadow);
}
.chart-container canvas { width: 100%; height: 200px; }

/* Car fuel stat */
.fuel-stat {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  margin-bottom: 16px; box-shadow: var(--shadow); text-align: center;
}
.fuel-stat .big { font-size: 28px; font-weight: 700; color: var(--primary); }
.fuel-stat .unit { font-size: 13px; color: var(--text-light); }

/* Empty state */
.empty { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
.empty p { font-size: 14px; }

/* Confirm dialog */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
  display: flex; align-items: center; justify-content: center;
}
.confirm-box {
  background: var(--card); border-radius: var(--radius); padding: 24px;
  width: 280px; text-align: center;
}
.confirm-box p { margin-bottom: 20px; font-size: 15px; }
.confirm-box .btns { display: flex; gap: 10px; }
.confirm-box button {
  flex: 1; padding: 10px; border-radius: var(--radius-sm); border: none;
  font-size: 14px; cursor: pointer; font-family: inherit;
}
.btn-cancel { background: var(--bg); color: var(--text); }
.btn-confirm { background: var(--danger); color: #fff; }
.btn-primary {
  display: block; width: 100%; padding: 12px; border: none;
  border-radius: var(--radius-sm); background: var(--primary); color: #fff;
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  margin-top: 4px;
}

/* Section title */
.section-title { font-size: 14px; font-weight: 600; color: var(--text-light); margin-bottom: 8px; margin-top: 16px; }
.section-title:first-child { margin-top: 0; }

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header" id="header">个人工作台</div>
  <div class="main" id="main"></div>
  <button class="fab" id="fab" title="添加记录">+</button>
  <nav class="nav" id="nav"></nav>
</div>

<div class="modal-overlay hidden" id="modalOverlay"></div>
<div class="confirm-overlay hidden" id="confirmOverlay"></div>

<script>
// ==================== IndexedDB ====================
const DB_NAME = 'WorkbenchDB', DB_VER = 1;
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('ledger')) {
        const s = d.createObjectStore('ledger', { keyPath: 'id', autoIncrement: true });
        s.createIndex('date', 'date', { unique: false });
        s.createIndex('type', 'type', { unique: false });
      }
      if (!d.objectStoreNames.contains('weight')) {
        const s = d.createObjectStore('weight', { keyPath: 'id', autoIncrement: true });
        s.createIndex('date', 'date', { unique: true });
      }
      if (!d.objectStoreNames.contains('car')) {
        const s = d.createObjectStore('car', { keyPath: 'id', autoIncrement: true });
        s.createIndex('date', 'date', { unique: false });
        s.createIndex('carType', 'carType', { unique: false });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function dbAdd(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).add(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll(store, indexName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const s = tx.objectStore(store);
    const req = indexName ? s.index(indexName).getAll() : s.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ==================== Config ====================
const LEDGER_CATS = {
  expense: ['🍜 餐饮','🚌 交通','🛒 购物','🎮 娱乐','🏠 住房','💊 医疗','📦 其他'],
  income: ['💰 工资','🎁 奖金','💼 兼职','📈 投资','📦 其他']
};

const CAR_CATS = ['⛽ 加油','🔧 保养','🛡️ 保险','🅿️ 停车','🛣️ 过路费','🧼 洗车','📦 其他'];

const MODULES = [
  { id: 'ledger', label: '记账', icon: '💰' },
  { id: 'weight', label: '体重', icon: '⚖️' },
  { id: 'car', label: '用车', icon: '🚗' }
];

// ==================== State ====================
let currentModule = 'ledger';
let carSubTab = 'fuel';
let editingId = null;
let deleteTarget = null;

// ==================== UI Helpers ====================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function formatDate(d) { return d.slice(0, 10); }
function fmtMoney(n) { return '¥' + Number(n).toFixed(2); }
function today() { return new Date().toISOString().slice(0, 10); }

// ==================== Render ====================
function renderNav() {
  const nav = $('#nav');
  nav.innerHTML = MODULES.map(m => `
    <div class="nav-item${m.id === currentModule ? ' active' : ''}" data-module="${m.id}">
      <span class="icon">${m.icon}</span>
      <span>${m.label}</span>
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => switchModule(el.dataset.module));
  });
}

function switchModule(id) {
  currentModule = id;
  carSubTab = 'fuel';
  renderNav();
  renderMain();
}

async function renderMain() {
  const main = $('#main');
  const header = $('#header');
  const fab = $('#fab');
  const mod = MODULES.find(m => m.id === currentModule);
  header.textContent = mod.label;
  fab.classList.remove('hidden');

  if (currentModule === 'ledger') await renderLedger(main);
  else if (currentModule === 'weight') await renderWeight(main);
  else if (currentModule === 'car') await renderCar(main);
}

// ---- Ledger ----
async function renderLedger(main) {
  const now = new Date();
  const month = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const records = (await dbGetAll('ledger')).sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  const monthRecords = records.filter(r => r.date.startsWith(month));

  const income = monthRecords.filter(r => r.type==='income').reduce((s,r) => s+r.amount, 0);
  const expense = monthRecords.filter(r => r.type==='expense').reduce((s,r) => s+r.amount, 0);

  main.innerHTML = `
    <div class="summary-row">
      <div class="summary-card"><div class="label">本月收入</div><div class="value income">${fmtMoney(income)}</div></div>
      <div class="summary-card"><div class="label">本月支出</div><div class="value expense">${fmtMoney(expense)}</div></div>
      <div class="summary-card"><div class="label">结余</div><div class="value balance">${fmtMoney(income-expense)}</div></div>
    </div>
    <div class="section-title">${month} 记录</div>
    ${records.length === 0 ? '<div class="empty"><div class="icon">📝</div><p>还没有记录，点击右下角 + 开始记账</p></div>' : ''}
    ${records.map(r => `
      <div class="list-item" data-id="${r.id}">
        <div class="cat-icon" style="background:${r.type==='income'?'rgba(39,174,96,0.12)':'rgba(231,76,60,0.12)'}">${r.category.slice(0,2)}</div>
        <div class="info">
          <div class="title">${r.category.slice(2)}</div>
          <div class="sub">${formatDate(r.date)} ${r.note||''}</div>
        </div>
        <div class="amount ${r.type}">${r.type==='income'?'+':'-'}${fmtMoney(r.amount)}</div>
        <button class="del-btn" data-del="${r.id}">✕</button>
      </div>
    `).join('')}
  `;
  bindDelete(main);
}

// ---- Weight ----
async function renderWeight(main) {
  const records = (await dbGetAll('weight')).sort((a,b) => a.date.localeCompare(b.date));
  const latest = records[records.length - 1];
  const height = localStorage.getItem('wb_height') || '';
  let bmi = '';
  if (latest && height) {
    const h = parseFloat(height) / 100;
    bmi = (latest.weight / (h * h)).toFixed(1);
  }

  main.innerHTML = `
    <div class="bmi-display">
      <div class="bmi-value">${latest ? latest.weight.toFixed(1) + ' kg' : '-- kg'}</div>
      <div class="bmi-label">最新体重${bmi ? ' · BMI ' + bmi + ' (' + bmiLabel(bmi) + ')' : ''}</div>
      <div style="margin-top:12px;font-size:12px;color:var(--text-light)">
        身高 <input type="number" id="heightInput" value="${height}" placeholder="cm"
          style="width:70px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:center"> cm
      </div>
    </div>
    ${records.length >= 2 ? `
      <div class="chart-container"><canvas id="weightChart"></canvas></div>
    ` : ''}
    <div class="section-title">历史记录</div>
    ${records.length === 0 ? '<div class="empty"><div class="icon">⚖️</div><p>还没有体重记录</p></div>' : ''}
    ${records.slice().reverse().map(r => {
      const prev = records[records.indexOf(r)-1];
      const diff = prev ? (r.weight - prev.weight).toFixed(1) : null;
      return `
        <div class="list-item" data-id="${r.id}">
          <div class="cat-icon" style="background:rgba(74,144,217,0.12)">⚖️</div>
          <div class="info">
            <div class="title">${r.weight.toFixed(1)} kg</div>
            <div class="sub">${formatDate(r.date)} ${r.note||''}</div>
          </div>
          <div class="amount" style="color:${diff>0?'var(--danger)':diff<0?'var(--success)':'var(--text-light)'}">
            ${diff ? (diff>0?'+':'')+diff+' kg' : ''}
          </div>
          <button class="del-btn" data-del="${r.id}">✕</button>
        </div>
      `;
    }).join('')}
  `;

  bindDelete(main);
  $('#heightInput')?.addEventListener('change', e => {
    localStorage.setItem('wb_height', e.target.value);
    renderMain();
  });

  if (records.length >= 2) setTimeout(() => drawWeightChart(records), 50);
}

function bmiLabel(bmi) {
  const v = parseFloat(bmi);
  if (v < 18.5) return '偏瘦';
  if (v < 24) return '正常';
  if (v < 28) return '偏胖';
  return '肥胖';
}

function drawWeightChart(records) {
  const canvas = $('#weightChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const W = rect.width - 32, H = 200;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const pad = { top: 20, right: 16, bottom: 32, left: 48 };
  const pw = W - pad.left - pad.right, ph = H - pad.top - pad.bottom;
  const vals = records.map(r => r.weight);
  const min = Math.floor(Math.min(...vals) - 2);
  const max = Math.ceil(Math.max(...vals) + 2);

  // Grid
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
  for (let i = min; i <= max; i += 2) {
    const y = pad.top + ph - ((i-min)/(max-min)) * ph;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W-pad.right, y); ctx.stroke();
    ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(i, pad.left - 6, y + 4);
  }

  // X labels
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(records.length / 6));
  records.forEach((r, i) => {
    if (i % step === 0 || i === records.length - 1) {
      const x = pad.left + (i/(records.length-1)) * pw;
      ctx.fillStyle = '#999'; ctx.font = '10px sans-serif';
      ctx.fillText(formatDate(r.date).slice(5), x, H - pad.bottom + 16);
    }
  });

  // Line
  ctx.strokeStyle = '#4A90D9'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  ctx.beginPath();
  records.forEach((r, i) => {
    const x = pad.left + (i/(records.length-1)) * pw;
    const y = pad.top + ph - ((r.weight-min)/(max-min)) * ph;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Dots
  records.forEach((r, i) => {
    const x = pad.left + (i/(records.length-1)) * pw;
    const y = pad.top + ph - ((r.weight-min)/(max-min)) * ph;
    ctx.fillStyle = '#4A90D9'; ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
  });
}

// ---- Car ----
async function renderCar(main) {
  const records = (await dbGetAll('car')).sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  const filtered = carSubTab === 'all' ? records : records.filter(r => r.carType === carSubTab);

  // Fuel stats
  const fuelRecords = records.filter(r => r.carType === 'fuel').sort((a,b) => a.date.localeCompare(b.date));
  let fuelStat = '';
  if (fuelRecords.length >= 2) {
    let totalKm = 0, totalL = 0;
    for (let i = 1; i < fuelRecords.length; i++) {
      totalKm += fuelRecords[i].mileage - fuelRecords[i-1].mileage;
      totalL += fuelRecords[i].liters;
    }
    const avg = totalKm > 0 ? (totalL / totalKm * 100).toFixed(1) : '--';
    fuelStat = `<div class="fuel-stat"><div class="big">${avg}</div><div class="unit">百公里油耗 (L/100km)</div></div>`;
  }

  const totalExpense = filtered.reduce((s,r) => s + (r.amount||0), 0);

  main.innerHTML = `
    <div class="sub-tabs">
      <div class="sub-tab${carSubTab==='fuel'?' active':''}" data-tab="fuel">⛽ 加油</div>
      <div class="sub-tab${carSubTab==='maintenance'?' active':''}" data-tab="maintenance">🔧 保养</div>
      <div class="sub-tab${carSubTab==='other'?' active':''}" data-tab="other">📦 其他</div>
      <div class="sub-tab${carSubTab==='all'?' active':''}" data-tab="all">📋 全部</div>
    </div>
    ${fuelStat}
    <div class="summary-row">
      <div class="summary-card"><div class="label">记录数</div><div class="value" style="color:var(--primary)">${filtered.length}</div></div>
      <div class="summary-card"><div class="label">合计费用</div><div class="value expense">${fmtMoney(totalExpense)}</div></div>
    </div>
    <div class="section-title">记录列表</div>
    ${filtered.length === 0 ? '<div class="empty"><div class="icon">🚗</div><p>还没有用车记录</p></div>' : ''}
    ${filtered.map(r => {
      const catName = CAR_CATS.find(c => c.includes(r.carType === 'fuel' ? '加油' : r.carType === 'maintenance' ? '保养' : '')) || '📦 其他';
      return `
        <div class="list-item" data-id="${r.id}">
          <div class="cat-icon" style="background:rgba(74,144,217,0.12)">${catName.slice(0,2)}</div>
          <div class="info">
            <div class="title">${catName.slice(2)}</div>
            <div class="sub">${formatDate(r.date)} ${r.note||''}${r.mileage ? ' · ' + r.mileage + 'km' : ''}${r.liters ? ' · ' + r.liters + 'L' : ''}</div>
          </div>
          <div class="amount expense">-${fmtMoney(r.amount||0)}</div>
          <button class="del-btn" data-del="${r.id}">✕</button>
        </div>
      `;
    }).join('')}
  `;

  bindDelete(main);
  main.querySelectorAll('.sub-tab').forEach(el => {
    el.addEventListener('click', () => { carSubTab = el.dataset.tab; renderMain(); });
  });
}

function bindDelete(container) {
  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      showConfirm('确定删除这条记录吗？', async () => {
        const store = currentModule === 'car' ? 'car' : currentModule;
        await dbDelete(store, Number(btn.dataset.del));
        renderMain();
      });
    });
  });
}

// ==================== Modal ====================
function showModal(title, content, onSubmit) {
  const overlay = $('#modalOverlay');
  overlay.innerHTML = `
    <div class="modal">
      <h3>${title}</h3>
      ${content}
      <button class="btn-primary" id="modalSubmit">确定</button>
    </div>
  `;
  overlay.classList.remove('hidden');

  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  $('#modalSubmit').addEventListener('click', async () => {
    try { await onSubmit(); closeModal(); } catch(err) { console.error(err); }
  });
}

function closeModal() {
  $('#modalOverlay').classList.add('hidden');
  editingId = null;
}

function showConfirm(msg, onConfirm) {
  const overlay = $('#confirmOverlay');
  overlay.innerHTML = `
    <div class="confirm-box">
      <p>${msg}</p>
      <div class="btns">
        <button class="btn-cancel" id="confirmCancel">取消</button>
        <button class="btn-confirm" id="confirmOk">删除</button>
      </div>
    </div>
  `;
  overlay.classList.remove('hidden');
  $('#confirmCancel').onclick = () => overlay.classList.add('hidden');
  $('#confirmOk').onclick = async () => {
    overlay.classList.add('hidden');
    await onConfirm();
  };
}

// ==================== Add/Edit Forms ====================
function showLedgerForm() {
  showModal('记一笔', `
    <div class="form-group">
      <div class="type-toggle" id="typeToggle">
        <button class="income-btn active" data-type="income">收入</button>
        <button class="expense-btn" data-type="expense">支出</button>
      </div>
    </div>
    <div class="form-group"><label>金额</label><input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0"></div>
    <div class="form-group"><label>分类</label><div class="cat-chips" id="catChips"></div></div>
    <div class="form-group"><label>日期</label><input type="date" id="fDate" value="${today()}"></div>
    <div class="form-group"><label>备注</label><input type="text" id="fNote" placeholder="可选"></div>
  `, async () => {
    const type = document.querySelector('#typeToggle .active').dataset.type;
    const amount = parseFloat($('#fAmount').value);
    const cat = document.querySelector('#catChips .selected')?.dataset.cat;
    if (!amount || amount <= 0) { alert('请输入金额'); throw new Error(); }
    if (!cat) { alert('请选择分类'); throw new Error(); }
    await dbAdd('ledger', { type, amount, category: cat, date: $('#fDate').value, note: $('#fNote').value.trim(), createdAt: Date.now() });
    renderMain();
  });

  // Type toggle
  const toggle = $('#typeToggle');
  toggle.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    toggle.querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    renderCatChips(b.dataset.type);
  }));
  renderCatChips('income');

  function renderCatChips(type) {
    const chips = $('#catChips');
    const cats = LEDGER_CATS[type];
    chips.innerHTML = cats.map((c,i) => `<span class="cat-chip${i===0?' selected':''}" data-cat="${c}">${c}</span>`).join('');
    chips.querySelectorAll('.cat-chip').forEach(c => c.addEventListener('click', () => {
      chips.querySelectorAll('.cat-chip').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected');
    }));
  }
}

function showWeightForm() {
  showModal('记录体重', `
    <div class="form-group"><label>体重 (kg)</label><input type="number" id="fWeight" placeholder="65.0" step="0.1" min="20" max="300"></div>
    <div class="form-group"><label>日期</label><input type="date" id="fDate" value="${today()}"></div>
    <div class="form-group"><label>备注</label><input type="text" id="fNote" placeholder="可选"></div>
  `, async () => {
    const weight = parseFloat($('#fWeight').value);
    if (!weight || weight < 20 || weight > 300) { alert('请输入有效体重'); throw new Error(); }
    const date = $('#fDate').value;
    // Check duplicate date
    const existing = await dbGetAll('weight');
    const dup = existing.find(r => r.date === date);
    if (dup) {
      await dbPut('weight', { ...dup, weight, note: $('#fNote').value.trim() });
    } else {
      await dbAdd('weight', { weight, date, note: $('#fNote').value.trim(), createdAt: Date.now() });
    }
    renderMain();
  });
}

function showCarForm() {
  const isFuel = carSubTab === 'fuel';
  const isMaint = carSubTab === 'maintenance';
  const type = isFuel ? 'fuel' : isMaint ? 'maintenance' : 'other';

  showModal('添加用车记录', `
    <div class="form-group"><label>类型</label>
      <select id="fCarType" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--bg)">
        <option value="fuel" ${type==='fuel'?'selected':''}>⛽ 加油</option>
        <option value="maintenance" ${type==='maintenance'?'selected':''}>🔧 保养</option>
        <option value="other" ${type==='other'?'selected':''}>📦 其他</option>
      </select>
    </div>
    ${isFuel ? `
      <div class="form-group"><label>当前里程 (km)</label><input type="number" id="fMileage" placeholder="50000"></div>
      <div class="form-group"><label>加油量 (L)</label><input type="number" id="fLiters" placeholder="45" step="0.01"></div>
    ` : ''}
    <div class="form-group"><label>金额</label><input type="number" id="fAmount" placeholder="0.00" step="0.01"></div>
    <div class="form-group"><label>日期</label><input type="date" id="fDate" value="${today()}"></div>
    <div class="form-group"><label>备注</label><input type="text" id="fNote" placeholder="可选"></div>
  `, async () => {
    const carType = $('#fCarType').value;
    const amount = parseFloat($('#fAmount').value) || 0;
    const date = $('#fDate').value;
    const note = $('#fNote').value.trim();
    const record = { carType, amount, date, note, createdAt: Date.now() };
    if (carType === 'fuel') {
      record.mileage = parseFloat($('#fMileage').value) || 0;
      record.liters = parseFloat($('#fLiters').value) || 0;
    }
    if (!date) { alert('请选择日期'); throw new Error(); }
    await dbAdd('car', record);
    renderMain();
  });
}

// ==================== Init ====================
async function init() {
  await openDB();

  renderNav();
  renderMain();

  // FAB click
  $('#fab').addEventListener('click', () => {
    if (currentModule === 'ledger') showLedgerForm();
    else if (currentModule === 'weight') showWeightForm();
    else if (currentModule === 'car') showCarForm();
  });

  // Register SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Resize handler for chart
  window.addEventListener('resize', () => {
    if (currentModule === 'weight') renderMain();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
